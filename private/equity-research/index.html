<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; frame-src 'self' about:; base-uri 'none'; form-action 'none'"><title>BaseAlpha · 私人报告</title><style>body{margin:0;background:#101827;color:#e3eaf5;font:16px/1.7 system-ui}#gate{max-width:580px;margin:18vh auto;padding:24px}iframe{width:100%;height:100dvh;border:0} [hidden]{display:none!important}</style></head><body><section id="gate"><h1>私人报告</h1><p id="status">请通过完整私人链接打开。报告内容已加密。</p><small>完整链接相当于访问钥匙，请勿转发。</small></section><iframe id="report" title="私人研究报告" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" hidden></iframe><script>
async function unlock(){const encoded=new URLSearchParams(location.hash.slice(1)).get('k');if(!encoded||!/^[A-Za-z0-9_-]{43}$/.test(encoded))return;const status=document.getElementById('status');status.textContent='正在解锁…';try{const raw=Uint8Array.from(atob(encoded.replace(/-/g,'+').replace(/_/g,'/')+'='),c=>c.charCodeAt(0));const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const res=await fetch('./content.enc?v='+Date.now(),{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});if(!res.ok)throw Error();const d=new Uint8Array(await res.arrayBuffer());const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12),additionalData:new TextEncoder().encode('basealpha-equity-report-v1')},key,d.slice(12));const frame=document.getElementById('report');frame.srcdoc=new TextDecoder().decode(clear);frame.hidden=false;document.getElementById('gate').hidden=true;}catch(e){status.textContent='无法解锁，请确认完整私人链接和网络连接。'}}unlock();
</script></body></html>
