<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; frame-src 'self' about:; base-uri 'none'; form-action 'none'"><title>BaseAlpha · 私密空间</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1516;color:#e7eee6;font:16px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.shell{max-width:1240px;margin:auto;padding:28px 24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30403b;padding-bottom:18px}.brand{letter-spacing:3px;font-size:14px}.private{color:#adbcaf;font-size:12px}h1{font-size:40px;line-height:1.25;margin:28px 0 10px}.muted{color:#abbdb5;font-size:14px}.gate{max-width:560px;margin:18vh auto;padding:28px;border:1px solid #3a5045;border-radius:16px;background:#132321}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 16px}button{font:inherit;color:#bdcfc3;background:#192c28;border:1px solid #3d5549;border-radius:8px;padding:9px 19px;cursor:pointer}button.active{color:#0e2018;background:#c3e2c9;border-color:#c3e2c9}.strip{display:flex;gap:24px;flex-wrap:wrap;margin:20px 0;padding:18px 0;border-bottom:1px solid #30403b}.stat strong{font-size:27px;display:block}.stat span{font-size:12px;color:#a5b4ac}iframe{background:#f3f4ed;width:100%;height:75vh;min-height:520px;border:0;border-radius:10px}.quote{background:#162724;border:1px solid #344a40;padding:24px;margin:16px 0;border-radius:10px}blockquote{font-size:22px;margin:16px 0;border-left:3px solid #b4d3bd;padding-left:16px}.pill{color:#c4dfb8}#workspace[hidden],#gate[hidden],[hidden]{display:none!important}footer{color:#8ca195;font-size:12px;margin-top:18px}@media(max-width:600px){.shell{padding:20px 14px}h1{font-size:31px}.private{max-width:125px;text-align:right}button{padding:8px 12px}.strip{gap:18px}}
.author-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.author-card{background:#162724;border:1px solid #344a40;padding:20px;border-radius:10px}.author-card h2{margin:0;font-size:23px}.author-card p{font-size:14px}.author-card button{width:100%;margin-top:8px}#author-detail{margin-top:24px}.entry{border-top:1px solid #344a40;padding:14px 0}.entry summary{cursor:pointer;font-weight:600}.entry small{color:#a8b7ae}.search{font:inherit;width:100%;padding:12px;background:#162724;color:#edf4ed;border:1px solid #5a7464;border-radius:8px}pre{white-space:pre-wrap;font:inherit;font-size:14px}.case-step{border-left:3px solid #a8c9b0;padding:8px 18px;margin:16px 0}.source-note{font-size:12px;color:#a8b7ae;overflow-wrap:anywhere}</style></head><body><div class="shell"><header><span class="brand">BASEALPHA</span><span class="private">PRIVATE RESEARCH</span></header><section id="gate" class="gate"><h1>私密研究空间</h1><p id="status">请通过完整的私密链接打开。此页面不公开研究内容。</p></section><main id="workspace" hidden><h1>币圈研究室</h1><p class="muted">从线索到证据，从研究到复盘。只记录当时知道的事。</p><div class="strip"><div class="stat"><strong id="candidate">—</strong><span>本轮项目线索</span></div><div class="stat"><strong id="market">—</strong><span>取得市场数据</span></div><div class="stat"><strong>1 小时</strong><span>计划研究间隔</span></div><div class="stat"><strong class="pill">研究中</strong><span>不自动交易</span></div></div><p id="updated" class="muted"></p><nav aria-label="研究板块"><button data-tab="agent" class="active">项目扫描</button><button data-tab="bloggers">博主研究</button><button data-tab="cases">经典案例</button><button data-tab="quotes">原话与感悟</button><button id="refresh">检查更新</button></nav><iframe id="document" title="研究内容" sandbox="allow-scripts"></iframe><section id="quotes" hidden></section><section id="bloggers" hidden></section><section id="cases" hidden></section><footer>完整链接相当于访问钥匙，请勿转发。页面内容由浏览器解密；已下载的内容无法远程收回。</footer></main></div><script>
let archive=null,current='agent';
const $=id=>document.getElementById(id);
function text(tag,value){const el=document.createElement(tag);el.textContent=value??'';return el;}
function show(tab){current=tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));for(const id of ['quotes','bloggers','cases'])$(id).hidden=tab!==id;$('document').hidden=tab!=='agent'&&tab!=='report';if(tab==='agent'||tab==='report')$('document').srcdoc=archive[tab+'_html'];}
function render(){const records=archive.scan.candidates||[];$('candidate').textContent=records.length;$('market').textContent=records.filter(c=>c.status==='market_read_unverified').length;const when=new Date(archive.scan.observed_at);const age=(Date.now()-when.getTime())/3600000;$('updated').textContent='最近实际采集：'+when.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+'（北京时间）'+(age>3?' · 数据已超过3小时，请留意任务或网络状态。':' · '+archive.scan.status+'；有限来源样本，非全链覆盖。');$('quotes').replaceChildren();for(const c of archive.excerpts.cards){const el=text('article','');el.className='quote';el.append(text('h2',c.title),text('small',c.date+' · 0xSun · 帖子 '+c.id),text('blockquote','“'+c.quote+'”'),text('p','语境：'+c.context),text('p','内容整理（非原话）：'+c.paraphrase),text('p','研究解读（非原话）：'+c.analysis));$('quotes').append(el);}renderLibrary();show(current);$('gate').hidden=true;$('workspace').hidden=false;}
async function unlock(){const encoded=new URLSearchParams(location.hash.slice(1)).get('k');if(!encoded||!/^[A-Za-z0-9_-]{43}$/.test(encoded)){return;}$('status').textContent='正在解锁…';try{const raw=Uint8Array.from(atob(encoded.replace(/-/g,'+').replace(/_/g,'/')+'='),c=>c.charCodeAt(0));const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const res=await fetch('./content.enc',{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});if(!res.ok)throw Error('unavailable');const data=new Uint8Array(await res.arrayBuffer());if(data.length<29)throw Error('invalid');const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:data.slice(0,12),additionalData:new TextEncoder().encode('basealpha-crypto-v1')},key,data.slice(12));archive=JSON.parse(new TextDecoder().decode(clear));render();}catch(e){$('status').textContent='无法解锁：链接不完整、内容尚未发布或网络不可用。请保留原来的完整链接后重试。';if(archive)$('updated').textContent+=' · 本次更新失败，当前仍显示上次解锁内容。';}}

function para(label,value){return text('p',label+value);}
function renderLibrary(){
 const pane=$('bloggers');pane.replaceChildren(text('h2','博主研究档案'),para('',archive.bloggers.scope),para('研究分工：','0xSun偏事件叙事与早期交易；蓝狐偏技术生态、真实需求和价值归属；套利案例作者帮助检验资金路径和执行条件。这里是对已有样本的归纳，不是收益或能力排名。'));
 const grid=text('div','');grid.className='author-grid';pane.append(grid);const detail=text('div','');detail.id='author-detail';pane.append(detail);
 for(const a of archive.bloggers.authors){const card=text('article','');card.className='author-card';card.append(text('h2',a.name),text('small','@'+a.handle),para('',a.focus),para('覆盖：',a.status));const btn=text('button',a.detail_type==='bluefox'?'阅读62条摘要':a.detail_type==='sun'?'查看研究与案例':'阅读已有研究');btn.addEventListener('click',()=>openAuthor(a));card.append(btn);grid.append(card);}
 const cases=$('cases');cases.replaceChildren(text('h2','经典案例：判断是怎样形成的'));
 for(const c of archive.case_library.cases){const box=text('article','');box.className='quote';box.append(text('h2',c.title),para('范围：',c.scope),para('',c.thesis));for(const t of c.timeline){const step=text('div','');step.className='case-step';step.append(text('h3',t.date),para('',t.event),para('证据边界：',t.boundary));box.append(step);}box.append(text('h3','验证清单，不冒充作者的已知操作'));for(const q of c.questions)box.append(para(q.label+'：',q.question),para('已知与未知：',q.known));box.append(text('h3','研究 Agent 怎样学习'),para('',c.agent_application));for(const s of c.sources){const note=para('出处：',s.note+' '+s.url);note.className='source-note';box.append(note);}cases.append(box);}
}
function openAuthor(a){const pane=$('author-detail');pane.replaceChildren(text('h2',a.name+' · 研究内容'),para('方法归纳：',a.method),para('可学习的部分：',a.lesson),para('判断边界：',a.boundary));
 if(a.id==='sun'){const btn=text('button','打开完整0xSun报告');btn.addEventListener('click',()=>show('report'));pane.append(btn);const c=text('button','阅读TRUMP案例');c.addEventListener('click',()=>show('cases'));pane.append(c);}
 if(a.id==='bluefox'){pane.append(para('档案范围：',archive.bloggers.bluefox_archive.scope));const input=text('input','');input.type='search';input.placeholder='搜索蓝狐主题、日期、项目与摘要';input.className='search';input.setAttribute('aria-label','搜索蓝狐摘要');pane.append(input);const list=text('div','');const items=[];for(const x of archive.bloggers.bluefox_archive.entries){const d=text('details','');d.className='entry';d.append(text('summary',x.id+' · '+x.date+' · '+x.title),text('small',x.theme+' / '+x.access),para('内容摘要（非原话）：',x.summary),para('边界：',x.note||x.fact_status),para('来源：',x.url));list.append(d);items.push(d);}pane.append(list);input.addEventListener('input',()=>{const q=input.value.trim().toLowerCase();items.forEach(d=>d.hidden=!d.textContent.toLowerCase().includes(q));});const review=text('details','');review.className='entry';review.append(text('summary','蓝狐研究方法与Agent缺口审查'),text('pre',archive.bloggers.bluefox_method_review));pane.append(review);}
 for(const path of a.documents){const note=para('本地来源：','03_信息源与X/'+path);note.className='source-note';pane.append(note);}pane.scrollIntoView({behavior:'smooth',block:'start'});
}

document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));$('refresh').addEventListener('click',unlock);unlock();
</script></body></html>
